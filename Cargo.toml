[package]
name = "omaestro"
version = "0.7.3"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
async-channel = "2"
base64 = "0.23.1"
futures-lite = "2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
ksni = { version = "0.3.6", default-features = false, features = ["async-io", "blocking"] }
lofty = "0.25.4"
mpris-server = "0.10.0"
ratatui = "0.30.2"
ratatui-image = { version = "11.1.0", default-features = false, features = ["crossterm"] }
rayon = "1.12.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
rustfft = "6.4.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1_smol = "1.0.1"
sha2 = "0.11.1"
toml = "1.1.8"
tungstenite = "0.30.0"
ureq = { version = "3", features = ["json"] }
